name: Publish to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    uses: reqstool/.github/.github/workflows/common-publish-to-github-pages.yml@6fc8d3e3d4c3fdf7a83cb7b7a274e4761486ca71 # 1.2.1
    permissions:
      contents: read
      pages: write
      id-token: write
