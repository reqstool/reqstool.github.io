name: Publish to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    uses: reqstool/.github/.github/workflows/common-publish-to-github-pages.yml@6340edb1ebc6c9cbeb3f533738ba8f9672a4d313 # 1.2.3
    permissions:
      contents: read
      pages: write
      id-token: write
