name: Publish to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    uses: reqstool/.github/.github/workflows/common-publish-to-github-pages.yml@84c822d93b538ed6c2e650ba1085aab271d018f3 # 1.3.0
    permissions:
      contents: read
      pages: write
      id-token: write
